timeout: 1600s
options:
  logging: CLOUD_LOGGING_ONLY
  # Manual `gcloud builds submit` (make deploy) has no SHORT_SHA; let it
  # resolve to "" instead of rejecting the build.
  substitution_option: ALLOW_LOOSE
  # _IMAGE and _CACHE_IMAGE are built out of ${PROJECT_ID} in the
  # substitutions block below. Trigger builds expand that nesting for
  # free; a manual submit does not unless this is set, and the tag then
  # reaches docker with a literal "${PROJECT_ID}" in it and is rejected
  # as an invalid reference.
  dynamic_substitutions: true

substitutions:
  # The image lives where Cloud Run's original source-deploy trigger put
  # it (Artifact Registry, us-east4) so trigger deploys and `make deploy`
  # update the same service with the same image lineage.
  _IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/podcasting_server/podcasting-server
  _CACHE_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/podcasting_server/podcasting-server:buildcache
  # Empty for trigger builds, which have no easy timestamp; the
  # Dockerfile falls back to the builder's own clock, so the stamp is
  # right either way. `make deploy` fills it from the local clock.
  _BUILT_AT: ""
  _SERVICE: podcasting-server
  _REGION: us-east4

steps:
  # (Optional) sanity check: print what we'll use
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        echo "PROJECT_ID=${PROJECT_ID}"
        echo "SHORT_SHA=${SHORT_SHA}"
        echo "_IMAGE=${_IMAGE}"
        echo "_CACHE_IMAGE=${_CACHE_IMAGE}"
        echo "_BUILT_AT=${_BUILT_AT}"
        # This step used to overwrite cmd/server/version.txt with
        # ${SHORT_SHA}, which meant the hand-bumped release number never
        # reached production and the release and the commit could not
        # both be shown. version.txt ships as written now; the commit and
        # the build time go in through the linker (see the Dockerfile).
        # GET /version still answers the commit — it reports which deploy
        # is live — it just reads it from the linker instead of the file.

  # Create & bootstrap a buildx builder (BuildKit)
  - name: gcr.io/cloud-builders/docker
    args: ["buildx", "create", "--use", "--name", "cb-bx"]
  - name: gcr.io/cloud-builders/docker
    args: ["buildx", "inspect", "--bootstrap"]

  # Build with registry cache and push
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - buildx
      - build
      - --tag=${_IMAGE}:${SHORT_SHA}
      # The build stamp the dashboard shows. Plain substitutions, no
      # shell: a $(...) in this file would be read by Cloud Build before
      # any shell sees it, and the first place that would surface is a
      # failed deploy.
      - --build-arg=COMMIT=${SHORT_SHA}
      - --build-arg=BUILT_AT=${_BUILT_AT}
      - --cache-from=type=registry,ref=${_CACHE_IMAGE}
      - --cache-to=type=registry,ref=${_CACHE_IMAGE},mode=max
      - --push
      - .

  # Swap the image on the existing service and nothing else: env vars,
  # secrets, and the runtime service account are managed on the service
  # itself (Cloud Run console / gcloud), so a deploy can never clobber
  # them. `services update` also leaves the public-access IAM binding
  # alone, unlike `run deploy --allow-unauthenticated`.
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --quiet
